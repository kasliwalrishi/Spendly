name: spendly
description: Spendly is a private, offline-first personal expense tracker.
publish_to: none
version: 1.0.1+2

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  intl: ^0.20.2
  fl_chart: ^1.1.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/spendly_icon.png"
  min_sdk_android: 21

# Bundles the Material icon font into every target, including Android release
# APKs. Widgets in lib/main.dart use Icons.* rather than text glyphs.
flutter:
  uses-material-design: true
